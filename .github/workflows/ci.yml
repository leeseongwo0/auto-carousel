name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.8.8
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Static security analysis
        run: uv run bandit -q -r src --severity-level high --confidence-level high
      - name: Build distribution from locked backend
        run: uv build --no-build-isolation
      - name: Check wheel metadata
        run: uv run twine check dist/*
      - name: Test
        run: NEWSBOT_WHEEL="$GITHUB_WORKSPACE/dist/telegram_news_bot-0.1.0-py3-none-any.whl" uv run pytest
      - name: Scan tracked files for new secrets
        run: |
          git ls-files -z |
            xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-groups --all-extras --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Generate SBOM
        run: |
          uv run cyclonedx-py environment --output-file "$RUNNER_TEMP/sbom.json"
          test -s "$RUNNER_TEMP/sbom.json"
