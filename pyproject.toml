[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-bot"
version = "0.1.0"
description = "Newsbot is a local-first news workflow tool."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "leeseongwo0"}]
maintainers = [{name = "leeseongwo0"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
telegram = [
    "telethon>=1.36,<2",
]
sheets = [
    "cryptography>=50,<51",
    "google-api-python-client>=2.176,<3",
    "google-auth>=2.40,<3",
    "google-auth-httplib2>=0.2,<1",
]
[project.urls]
Repository = "https://github.com/leeseongwo0/auto-carousel"
Issues = "https://github.com/leeseongwo0/auto-carousel/issues"
[project.scripts]
newsbot = "newsbot.cli:main"

[dependency-groups]
dev = [
    "bandit==1.8.6",
    "cyclonedx-bom==7.3.1",
    "detect-secrets==1.5.0",
    "mypy>=1.11",
    "pip-audit==2.10.1",
    "pytest>=8.3",
    "ruff>=0.6",
    "setuptools==83.0.0",
    "twine==6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
[tool.setuptools.package-data]
"newsbot.ai" = ["resources/*.json"]
"newsbot" = ["migrations/*.sql"]
